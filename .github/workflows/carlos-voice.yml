name: Jarvis - Validar motor de voz
on:
  push:
    branches: [codex/restore-local-voice-20261020]
    paths: ['voice/**', '.github/workflows/carlos-voice.yml']
  pull_request:
    paths: ['voice/**', '.github/workflows/carlos-voice.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carlos-voice-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test reference protection and audio validation
        run: |
          python -m py_compile voice/narrate.py voice/test_narrate.py
          python -m unittest discover -s voice -p 'test_*.py' -v
      - name: Install CPU inference dependencies
        env:
          PIP_NO_CACHE_DIR: '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install -c voice/constraints.txt 'voxcpm @ git+https://github.com/OpenBMB/VoxCPM.git@cce58a5b59303c9bd63d12f23afe6a49a4a80c59'
          python -m pip check
          python -c "from voxcpm import VoxCPM; import torch; print('VoxCPM import OK; torch', torch.__version__)"
